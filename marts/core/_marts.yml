version: 2

models:

  - name: dim_stations

    description: >
      Dimensão contendo informações cadastrais e geográficas
      das estações do Austin Bikeshare.

    columns:

      - name: station_id
        description: "Chave da estação."
        tests:
          - not_null
          - unique

      - name: station_name
        description: "Nome da estação."

      - name: station_status
        description: "Status operacional da estação."

      - name: latitude
        description: "Latitude geográfica."

      - name: longitude
        description: "Longitude geográfica."

          - name: fct_trips

    description: >
      Tabela fato contendo uma linha por viagem realizada.

    columns:

      - name: trip_id
        description: "Identificador único da viagem."
        tests:
          - not_null
          - unique

      - name: start_station_id
        description: "Estação de origem."

        tests:
          - relationships:
              to: ref('dim_stations')
              field: station_id

      - name: end_station_id
        description: "Estação de destino."

        tests:
          - relationships:
              to: ref('dim_stations')
              field: station_id

      - name: subscriber_type
        description: "Tipo de assinante."

        tests:
          - not_null

      - name: bike_type
        description: "Tipo de bicicleta."

      - name: duration_minutes
        description: "Duração da viagem em minutos."